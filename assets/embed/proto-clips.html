<title>產線影片｜雷射裁切與繡花</title>
<link rel="stylesheet" href="_strip.css">
</head>
<body>
<div class="strip three">
  <!-- 來源檔：proto-clip-3.mp4（原 809873851.204640）雷射裁切 -->
  <figure class="card">
    <div class="media">
      <video src="../proto-clip-3.mp4" poster="poster-proto-clip-3.jpg" controls preload="metadata" playsinline></video>
    </div>
    <figcaption class="cap"><b>① 雷射裁切</b>用雷射把絨布裁出精準的形狀，切口同時封邊，比刀模裁更不容易鬆線。這就是「開版」實際發生的樣子：先有版型，機器才知道要裁什麼。</figcaption>
  </figure>
  <!-- 來源檔：proto-clip-1.mp4（原 809873850.990438）繡花 -->
  <figure class="card">
    <div class="media">
      <video src="../proto-clip-1.mp4" poster="poster-proto-clip-1.jpg" controls preload="metadata" playsinline></video>
    </div>
    <figcaption class="cap"><b>② 繡花上機</b>十二針電腦繡花機運轉中。每換一個顏色就要重新對位，車完一組線才換下一根針。</figcaption>
  </figure>
  <!-- 來源檔：proto-clip-2.mp4（原 809873851.159553）繡花 -->
  <figure class="card">
    <div class="media">
      <video src="../proto-clip-2.mp4" poster="poster-proto-clip-2.jpg" controls preload="metadata" playsinline></video>
    </div>
    <figcaption class="cap"><b>③ 繡花上機</b>同一片面料的另一段車縫。鏡頭與條紋都是繡上去的，不是印上去的。印刷會被咬掉，繡線不會。</figcaption>
  </figure>
</div>
<p class="hint">← 左右滑動看三段影片 →</p>
</body>
</html>
