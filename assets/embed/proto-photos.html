<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>產線實拍｜繡花機與機身面料</title>
<link rel="stylesheet" href="_strip.css">
</head>
<body>
<div class="strip two">
  <figure class="card">
    <div class="media">
      <img src="../proto-embroidery-machine.jpg" alt="電腦繡花機正在絨布上車出拍立得的鏡頭與彩色條紋" loading="lazy">
    </div>
    <figcaption class="cap"><b>十二針電腦繡花機上機</b>每一條彩色線都是這台機器一針一針車出來的。畫面裡同時可以看到兩個階段：右邊已經完成鏡頭與四色條紋，左邊還在車第一組線。</figcaption>
  </figure>
  <figure class="card">
    <div class="media">
      <img src="../proto-embroidery-detail.jpg" alt="完成的貼布繡鏡頭、閃光燈與四色條紋特寫" loading="lazy">
    </div>
    <figcaption class="cap"><b>繡好的機身面料特寫</b>黑色鏡頭是貼布繡（把布剪形後車縫收邊），橘色方塊是閃光燈，藍橘黃藍四色條紋是拍立得的經典彩虹。這塊布不會出現在任何工廠的公版目錄上。</figcaption>
  </figure>
</div>
<p class="hint">← 左右滑動看兩張實拍 →</p>
</body>
</html>
